[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrum-client"
version = "3.0.0"
description = "Python SDK for ASTRUM controllers: Zenoh transport, Cap'n Proto wire (schema v3), control loop and law runtime."
requires-python = ">=3.12"
# eclipse-zenoh must equal the Rust zenoh crate in Cargo.lock (Zenoh only
# guarantees protocol compatibility within a release; scripts/verify-toolchain.sh
# checks it).
dependencies = ["eclipse-zenoh==1.10.0", "pycapnp>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["astrum_client"]

[tool.setuptools.package-data]
# A symlink to crates/astrum-proto/schema/astrum.capnp; builds copy its content.
astrum_client = ["astrum.capnp"]
