# ASTRUM scenario — a 4-ship F-16 formation demo.
#
# Aircraft 1 is the LEADER: flown by `laws/figure8.py`, it traces a horizontal
# figure-eight (a Gerono lemniscate) centred on the ENU origin. Aircraft 2-4 are
# FOLLOWERS: each runs `laws/formation.py` independently, watching only the
# leader's telemetry off the bus and driving its own slot error to zero with a
# per-follower MPC — a fully decentralized formation.
#
# The controllers are wired up by the `formation` compose profile
# (`make demo-formation`). Initial positions put each follower roughly at its
# slot (left / right / trail) behind the leader; the MPC captures the rest.

[world]
# Pattern is centred here (ENU origin). F-16-friendly: high enough for a fast jet.
origin_lat_deg = 37.6188
origin_lon_deg = -122.3756
origin_alt_m = 0.0

[sim]
rate_hz = 120.0
# Bounded so `make demo-formation` self-terminates. At ~120 m/s a full lap of the
# 8 km x 4 km pattern takes ~320 s; 220 s covers the formation-capture transient
# plus both hard lobes and the crossover (the most aggressive parts of the track).
max_time_s = 220.0
# Real-time so the run is watchable in the 3-D replay renderer.
realtime = true

# --- Fleet -------------------------------------------------------------------
# All F-16s (fixed-wing inferred from the model). ~15000 ft, ~233 kts (~120 m/s)
# — the speed the leader's --speed 100 command settles at through the sim's
# throttle loop, so starting there avoids a speed transient. The 8 km x 4 km
# pattern drives the f16 inner loop to ~41 deg of bank at the lobes (well under
# its 60-deg limit), with the load-factor feedforward holding altitude in the turn.

[[aircraft]]
# LEADER — figure-eight. Initial heading ~= the pattern tangent at tau=0
# (atan2(Rx, Ry) = atan2(18000, 9000) ~= 63 deg) so it eases straight onto the curve.
id = 1
model = "f16"
lat_deg = 37.6188
lon_deg = -122.3756
alt_ft = 15000.0
heading_deg = 63.0
airspeed_kts = 233.0

[[aircraft]]
# FOLLOWER — left wing. Starts near its slot (~94 m west, ~31 m north of leader).
id = 2
model = "f16"
lat_deg = 37.619079
lon_deg = -122.376666
alt_ft = 15000.0
heading_deg = 63.0
airspeed_kts = 233.0

[[aircraft]]
# FOLLOWER — right wing (~31 m west, ~94 m south of leader).
id = 3
model = "f16"
lat_deg = 37.617956
lon_deg = -122.375952
alt_ft = 15000.0
heading_deg = 63.0
airspeed_kts = 233.0

[[aircraft]]
# FOLLOWER — trail (~125 m west, ~63 m south, 100 ft below the leader).
id = 4
model = "f16"
lat_deg = 37.618234
lon_deg = -122.377018
alt_ft = 14900.0
heading_deg = 63.0
airspeed_kts = 233.0
