# Bounded single-aircraft scenario for the M5 controller smoke test.
# Aircraft 1 starts heading east (90°); the example C++ controller commands it
# north (0°), so telemetry should show psi converging 90° → 0° over ~25-30 s.

[world]
origin_lat_deg = 37.6188
origin_lon_deg = -122.3756
origin_alt_m = 0.0

[sim]
rate_hz = 120.0
max_time_s = 40.0
realtime = true

[[aircraft]]
id = 1
model = "c172x"
lat_deg = 37.6188
lon_deg = -122.3756
alt_ft = 5000.0
heading_deg = 90.0
airspeed_kts = 100.0
