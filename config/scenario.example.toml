# FORGE scenario — a geodetic ENU origin plus a fleet of aircraft with initial
# conditions. `forge-sim` loads this to spawn one ECS entity (each owning its own
# JSBSim FDM) per `[[aircraft]]` entry. Copy to `config/scenario.toml` to customise.

[world]
# Local-tangent ENU grid origin (WGS84). Every aircraft's ENU (X=E, Y=N, Z=U)
# position is expressed relative to this point. Pick it near your fleet so
# Cartesian coordinates stay small and well-conditioned.
origin_lat_deg = 37.6188
origin_lon_deg = -122.3756
origin_alt_m = 0.0

[sim]
# Fixed-step physics rate (Hz). Physics advances one deterministic step of
# 1/rate_hz seconds per loop.
rate_hz = 120.0
# Optional: stop after this many simulated seconds (0 / omitted = run indefinitely).
max_time_s = 0.0
# true (default) throttles to ~real-time for live controllers; false runs as fast
# as the host allows (batch / testing). Trajectory is identical either way.
realtime = true

# --- Fleet -------------------------------------------------------------------
# One entity per entry. `id` is the ZMQ telemetry topic / command target id and
# must be unique. Initial conditions map to JSBSim `ic/*` properties.

[[aircraft]]
id = 1
model = "f16"
lat_deg = 37.6188
lon_deg = -122.3756
alt_ft = 15000.0
heading_deg = 90.0
airspeed_kts = 400.0

[[aircraft]]
id = 2
model = "f16"
lat_deg = 37.6200
lon_deg = -122.3700
alt_ft = 16000.0
heading_deg = 180.0
airspeed_kts = 420.0
