# ASTRUM scenario — a geodetic ENU origin plus a fleet of aircraft with initial
# conditions. `astrum-sim` loads this to spawn one ECS entity (each owning its own
# JSBSim FDM) per `[[aircraft]]` entry. Copy to `config/scenario.toml` to
# customise. Unknown keys are errors; units are SI (metres, m/s), angles degrees.

[world]
# Local-tangent ENU grid origin (WGS84). Every aircraft's ENU (X=E, Y=N, Z=U)
# position is expressed relative to this point. Pick it near your fleet so
# Cartesian coordinates stay small and well-conditioned.
origin_lat_deg = 37.6188
origin_lon_deg = -122.3756
origin_alt_hae_m = 0.0          # height above the WGS84 ellipsoid

[sim]
# Fixed-step physics rate (Hz). Physics advances one deterministic step of
# 1/rate_hz seconds per loop.
rate_hz = 120.0
# Stop after this many simulated seconds (0 / omitted = run indefinitely).
max_time_s = 0.0
# true (default) throttles to ~real time for live controllers; false runs as fast
# as the host allows. With external controllers, only `lockstep` makes runs
# reproducible (commands otherwise land on whichever tick they arrive).
realtime = true
# Seed for gun dispersion and each aircraft's JSBSim random generator.
seed = 0
# Threads stepping the FDMs in parallel (astrum-sim --threads overrides; 0 = all
# cores). The result is identical for any value.
threads = 1
# A controller must keep commanding: an aircraft that received commands and then
# gets none for this long switches to the failsafe hold (0 disables).
command_lease_s = 0.5
# lockstep = true makes the sim wait each tick for commands from every aircraft
# marked `lockstep = true`, failing after lockstep_timeout_s.
lockstep = false
lockstep_timeout_s = 30.0

# --- Fleet -------------------------------------------------------------------
# `id` is the Zenoh key suffix / command target and must be unique. Known models:
# c172x (trainer gains), f16 (fighter gains), F450 (multirotor). Any other model
# needs `kind = "fixed-wing" | "multirotor"` and, if fixed-wing,
# `autopilot_profile = "trainer" | "fighter"`. Fixed-wing aircraft are trimmed
# for level flight at spawn (`trim = false` to skip); a failed trim is fatal.

[[aircraft]]
id = 1
model = "f16"
lat_deg = 37.6188
lon_deg = -122.3756
alt_hae_m = 4572.0
heading_deg = 90.0
tas_mps = 250.0                 # true airspeed (≈ 400 KCAS at this altitude)
team = 0

[[aircraft]]
id = 2
model = "f16"
lat_deg = 37.6200
lon_deg = -122.3700
alt_hae_m = 4877.0
heading_deg = 180.0
tas_mps = 260.0
team = 0
