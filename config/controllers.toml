# Controller catalog: the SDK controller programs the web studio can launch, one
# entry per (program, law). `ControllerSpec::render` (crates/astrum-sim/src/controllers.rs)
# turns an entry plus parameter values into one `controllers` command line; paths are
# relative to the repo root. Build the C++ programs first:
#   cmake -S controllers -B build/controllers && cmake --build build/controllers -j
# Parameter types: number | integer | choice | aircraft; `target` marks the aircraft
# state a parameter commands (heading_deg | alt_hae_m | tas_mps).

[[controller]]
id = "cpp-hold"
name = "C++ hold"
description = "Raw-actuator heading / altitude / airspeed hold written against the C++ SDK."
command = ["build/controllers/cpp/astrum-controller", "--law", "hold"]
id_flag = "--id"
kinds = ["fixed-wing"]
needs_fleet = false

[[controller.param]]
name = "heading"
flag = "--heading"
label = "Heading"
unit = "deg"
type = "number"
default = 0.0
min = 0.0
max = 360.0
target = "heading_deg"

[[controller.param]]
name = "alt"
flag = "--alt"
label = "Altitude (HAE)"
unit = "m"
type = "number"
default = 1500.0
target = "alt_hae_m"

[[controller.param]]
name = "speed"
flag = "--speed"
label = "True airspeed"
unit = "m/s"
type = "number"
default = 50.0
min = 0.0
target = "tas_mps"

[[controller.param]]
name = "max-bank"
flag = "--max-bank-deg"
label = "Max bank"
unit = "deg"
type = "number"
default = 25.0
min = 1.0
max = 89.0

[[controller.param]]
name = "max-pitch"
flag = "--max-pitch-deg"
label = "Max pitch"
unit = "deg"
type = "number"
default = 10.0
min = 1.0
max = 89.0

[[controller]]
id = "cpp-autopilot"
name = "C++ autopilot"
description = "Sends the heading / altitude / airspeed reference to the sim's built-in autopilot (C++ SDK)."
command = ["build/controllers/cpp/astrum-controller", "--law", "autopilot"]
id_flag = "--id"
kinds = ["fixed-wing", "multirotor"]
needs_fleet = false

[[controller.param]]
name = "heading"
