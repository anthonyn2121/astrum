# C++ hold controller flies aircraft 1 (c172x) from east to north at 1500 m HAE, 50 m/s TAS.
#
#   astrum run config/demos/cpp.toml --watch
#
# The controller closes the loop itself (raw actuators); run it with
# ASTRUM_CONTROL_MODE=autopilot to hand the target to the sim's built-in inner
# loop instead. Telemetry shows psi converging 90° → 0° over the 40 s scenario.

base = "config/scenario.demo.toml"

controllers = [
  "build/controllers/cpp/astrum-controller --id 1 --heading 0 --alt 1500 --speed 50",
]
