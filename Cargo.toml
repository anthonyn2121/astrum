[workspace]
resolver = "2"
members = [
    "crates/astrum-fdm",
    "crates/astrum-geo",
    "crates/astrum-proto",
    "crates/astrum-net",
    "crates/astrum-bag",
    "crates/astrum-sim",
    "crates/astrum-web",
    "crates/astrum-env",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# Matches rust-toolchain.toml; bump both together.
rust-version = "1.98"
# Internal workspace crates; never published to crates.io.
publish = false

[workspace.dependencies]
# Pinned exactly: the C/C++ (zenoh-c / zenoh-cpp debs) and Python (eclipse-zenoh)
# sides are installed at this same version in docker/Dockerfile, and Zenoh only
# guarantees protocol compatibility within a release. Only the TCP transport is
# used, so QUIC/TLS/WS/UDP/compression/auth are left out of the build.
zenoh = { version = "=1.10.0", default-features = false, features = ["transport_tcp"] }
capnp = "0.27"
capnpc = "0.27"
# clap drives every binary's CLI; `env` lets each flag fall back to its
# environment variable (CLI arg > $ENV > default).
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
