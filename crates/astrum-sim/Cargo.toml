[package]
name = "astrum-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ASTRUM headless Bevy ECS: the authoritative multi-aircraft state server."

[lib]
name = "astrum_sim"
path = "src/lib.rs"

[[bin]]
name = "astrum-sim"
path = "src/main.rs"

[dependencies]
# Headless: no render/winit/audio, and no Bevy task-pool parallelism: the tick is
# a strict chain, and FDM stepping runs on a per-app rayon pool (`sim.threads`).
bevy = { version = "0.19", default-features = false }
astrum-fdm = { path = "../astrum-fdm" }
astrum-geo = { path = "../astrum-geo" }
astrum-net = { path = "../astrum-net" }
astrum-proto = { path = "../astrum-proto" }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rayon = "1"
