[package]
name = "astrum-race"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ASTRUM drone-racing environment: gates, a Monte-Carlo course sampler, scoring and crash detection, run on astrum-sim."

[lib]
name = "astrum_race"
path = "src/lib.rs"

[[bin]]
name = "astrum-race"
path = "src/main.rs"

[dependencies]
# Headless, like the sim: no render/winit/audio.
bevy = { version = "0.19", default-features = false }
# A race is an astrum-sim scenario plus a `[course]`: the sim's app (fleet spawn,
# FDM stepping, command ownership and lockstep, telemetry, recording, pacing) is
# built by `astrum_sim::build_app`, and this crate adds the race systems to it.
astrum-sim = { path = "../astrum-sim" }
astrum-geo = { path = "../astrum-geo" }
astrum-net = { path = "../astrum-net" }
astrum-proto = { path = "../astrum-proto" }
clap = { workspace = true }
ctrlc = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
astrum-bag = { path = "../astrum-bag" }
tempfile = "3"
