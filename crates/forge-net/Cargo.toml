[package]
name = "forge-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "FORGE ZMQ transport: telemetry PUB/SUB and command PUSH/PULL over the forge-proto wire schema."

[lib]
name = "forge_net"

[dependencies]
forge-proto = { path = "../forge-proto" }
# C-backed libzmq binding: synchronous, so it drops cleanly into Bevy's
# synchronous systems and shares the same libzmq as cppzmq / pyzmq.
zmq = "0.10"
