[package]
name = "astrum-fdm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Safe Rust FFI wrapper over a single JSBSim FGFDMExec instance."
# Exports DEP_JSBSIM_LIBDIR to dependents' build scripts (see build.rs).
links = "jsbsim"

[lib]
name = "astrum_fdm"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
