[package]
name = "forge-bag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "FORGE telemetry bag: record the telemetry stream and replay it as another ZMQ publisher."

[lib]
name = "forge_bag"

# `record` subscribes to live telemetry and writes a bag; `play` replays a bag
# as a PUB, feeding any subscriber (controller / replay renderer) exactly as the
# live sim would.
[[bin]]
name = "forge-bag-record"
path = "src/bin/record.rs"

[[bin]]
name = "forge-bag-play"
path = "src/bin/play.rs"

[dependencies]
forge-proto = { path = "../forge-proto" }
forge-net = { path = "../forge-net" }
capnp = "0.21"
