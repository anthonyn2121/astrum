[package]
name = "astrum-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ASTRUM ZMQ transport: telemetry PUB/SUB and command PUSH/PULL over the astrum-proto wire schema."

[lib]
name = "astrum_net"

[dependencies]
astrum-proto = { path = "../astrum-proto" }
# C-backed libzmq binding: synchronous, so it drops cleanly into Bevy's
# synchronous systems and shares the same libzmq as cppzmq / pyzmq.
zmq = "0.10"
