[package]
name = "astrum-env"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Python bindings for the embedded ASTRUM multi-agent environment"

[lib]
# The importable Python extension module is `astrum_env`. A cdylib only:
# `test = false` / `doctest = false` keep `cargo test --workspace` from building
# a test harness for it, which would fail to link (an `extension-module` build
# leaves libpython symbols for the interpreter to resolve at import time). The
# Rust seam is tested in `astrum-sim/tests/env.rs`; the binding by the Python
# tests in `python/`.
name = "astrum_env"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# Direct dependency so build.rs can read DEP_JSBSIM_LIBDIR for the rpath.
astrum-fdm = { path = "../astrum-fdm" }
astrum-proto = { path = "../astrum-proto" }
astrum-sim = { path = "../astrum-sim" }
numpy = "0.30"
# Steps a batch of independent environments in parallel within one call.
rayon = "1"

[dependencies.pyo3]
version = "0.30"
# abi3-py39: one forward-compatible module against the stable ABI (no python3-dev
# headers, no libpython link). extension-module: don't link libpython.
features = ["extension-module", "abi3-py39"]
