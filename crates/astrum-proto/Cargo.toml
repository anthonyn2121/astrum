[package]
name = "astrum-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ASTRUM Cap'n Proto wire schema + generated Rust bindings (telemetry, commands)."

[lib]
name = "astrum_proto"

[dependencies]
astrum-geo = { path = "../astrum-geo" }
# `unaligned`: decode straight from a Zenoh payload slice, whose alignment is not
# guaranteed, without first copying it into word-aligned segments.
capnp = { workspace = true, features = ["unaligned"] }

[build-dependencies]
capnpc = { workspace = true }

[dev-dependencies]
# Reads the cross-language fixture values (tests/fixtures/values.json).
serde_json = { workspace = true }
