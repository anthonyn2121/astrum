# ASTRUM Python style: ruff as both formatter and linter for every tracked
# Python file — controllers/python, controllers/optimal/python and the
# astrum-env adapter (crates/astrum-env/python). The Rust side uses
# rustfmt/clippy. `make fmt` / `make fmt-check` / `make lint` pass the file list
# from `git ls-files`, so untracked local workspaces are never touched.
line-length = 100
target-version = "py312"

[lint]
# ruff's default set (pyflakes F + pycodestyle E4/E7/E9) plus warnings (W) and
# import sorting (I). Code layout / line length is owned by `ruff format`, so the
# noisy whitespace + line-length rules (E1/E2/E3/E501) stay off.
select = ["E4", "E7", "E9", "F", "W", "I"]
