# cargo-deny configuration (`make deny`, part of `make ci`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the graph for every platform we build for (amd64/arm64 Linux images).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# RustSec advisories: vulnerabilities and unsound crates always fail; yanked
# crates fail; unmaintained crates fail only when we depend on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # lz4_flex 0.10 block decompression can leak uninitialised memory. Every
    # zenoh-transport release (incl. 1.10.x) requires lz4_flex ^0.10, so there is
    # no fixed version to move to; the only lz4_flex decompression call in
    # zenoh-transport is behind its `transport_compression` feature, which the
    # workspace never enables (zenoh is built with only `transport_tcp`). Drop
    # this once zenoh moves to lz4_flex >= 0.11.6.
    { id = "RUSTSEC-2026-0041", reason = "unreachable: zenoh transport_compression is disabled; no zenoh release depends on a fixed lz4_flex" },
]

[licenses]
# Every license that some dependency in Cargo.lock actually needs (cargo-deny
# evaluates SPDX expressions, so `MIT OR Apache-2.0` crates are covered by
# either). All are permissive or weak/file-level copyleft (MPL-2.0, EPL-2.0)
# that is compatible with distributing ASTRUM under MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are unpublished (license checked via Cargo.toml).
ignore = true

[bans]
# Duplicate versions are reported (Bevy/zenoh pull several) but don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
