name: astrum

# ASTRUM runtime topology: an authoritative `sim` service (Bevy ECS state server)
# and one or more `controller` services (flight controllers), talking over Zenoh
# on a shared network. Both share one dev image built from docker/Dockerfile.
#
# The sim LISTENs on one Zenoh endpoint (tcp/0.0.0.0:7447); every other service
# CONNECTs to tcp/sim:7447. Telemetry (astrum/telemetry/<id>) and commands
# (astrum/command/<id>) share that single endpoint — no more separate ports.
#
#   sim        (runs astrum-sim: telemetry out, commands in)
#   recorder   (astrum-bag-record; `--profile record up recorder`)
#   controller (builds & runs controllers/cpp/astrum-controller)
#   formation  (leader figure-eight + 3 decentralized MPC followers; `make demo-formation`)

# Shared base for the four formation controllers — all run the Python optimal
# runtime against the sim, differing only in their law/slot args (`command`).
x-formation-controller: &formation-controller
  image: astrum-dev:latest
  working_dir: /workspace
  profiles: ["formation"]
  volumes:
    - ./:/workspace
    - cargo-registry:/usr/local/cargo/registry
    - cargo-target:/workspace/target
  environment:
    # Each controller CONNECTS to the sim by name (run.py reads this as --connect).
    ASTRUM_ZENOH_CONNECT: tcp/sim:7447
  depends_on:
    - sim
  networks:
    - astrum

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: astrum-dev:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      # The sim LISTENs here; every other service connects to tcp/sim:7447.
      ASTRUM_ZENOH_LISTEN: tcp/0.0.0.0:7447
      # Overridable from the host env (e.g. `make demo` injects the bounded
      # single-ship scenario); defaults to the multi-aircraft fleet.
      ASTRUM_SCENARIO: ${ASTRUM_SCENARIO:-config/scenario.example.toml}
    ports:
      - "7447:7447"   # Zenoh (telemetry + commands)
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "cargo run --release -p astrum-sim"

  recorder:
    # Records the live telemetry stream to a bag file for later replay
    # (`astrum-bag-play`). Opt-in: `docker compose --profile record up recorder`.
    image: astrum-dev:latest
    working_dir: /workspace
    profiles: ["record"]
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      ASTRUM_ZENOH_CONNECT: tcp/sim:7447
      ASTRUM_BAG: /workspace/recordings/session.bag
      ASTRUM_BAG_SECONDS: "0" # record until stopped
    depends_on:
      - sim
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "mkdir -p recordings && cargo run --release -p astrum-bag --bin astrum-bag-record"

  replay:
    # The browser-based 3-D replay renderer. Serves the static `web/` app over
    # HTTP and bridges the live telemetry PUB to connected browsers over
    # WebSocket (one JSON frame per sample). Point a browser at
    # http://localhost:8080 while the sim (or `astrum-bag-play`) is running.
    # Started alongside the fleet by `make replay`, or on its own:
    #   docker compose up replay
    image: astrum-dev:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      # Subscribe to the sim's telemetry; serve the renderer on :8080.
      ASTRUM_ZENOH_CONNECT: tcp/sim:7447
      ASTRUM_WEB_BIND: 0.0.0.0:8080
      ASTRUM_WEB_ROOT: /workspace/web
    ports:
      - "8080:8080"   # HTTP + WebSocket (/telemetry)
    depends_on:
      - sim
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "cargo run --release -p astrum-web --bin astrum-web"

  controller:
    # Reuses the image built by the `sim` service (no second build).
    image: astrum-dev:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      # The controller CONNECTS to the sim service by name.
      ASTRUM_ZENOH_CONNECT: tcp/sim:7447
      # Command aircraft 1 to fly north at 1500 m / 50 m/s, closing the loop in
      # the controller (raw actuators). Run with ASTRUM_CONTROL_MODE=autopilot to
      # hand the target to the sim's built-in inner loop instead.
      ASTRUM_TARGET_ID: "1"
      ASTRUM_TARGET_HEADING_DEG: "0"
      ASTRUM_TARGET_ALT_M: "1500"
      ASTRUM_TARGET_SPD_MPS: "50"
      ASTRUM_CONTROL_MODE: ${ASTRUM_CONTROL_MODE:-raw}
    depends_on:
      - sim
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "cmake -S controllers/cpp -B controllers/cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build controllers/cpp/build -j && exec ./controllers/cpp/build/astrum-controller"

  controller-python:
    # The Python twin of `controller` — same wiring, runs controllers/python.
    # Opt-in: `docker compose --profile python up sim controller-python`
    # (or `make demo-python`). No build step; pyzmq + pycapnp ship in the image.
    image: astrum-dev:latest
    working_dir: /workspace
    profiles: ["python"]
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      ASTRUM_ZENOH_CONNECT: tcp/sim:7447
      ASTRUM_TARGET_ID: "1"
      ASTRUM_TARGET_HEADING_DEG: "0"
      ASTRUM_TARGET_ALT_M: "1500"
      ASTRUM_TARGET_SPD_MPS: "50"
      ASTRUM_CONTROL_MODE: raw
    depends_on:
      - sim
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "exec python controllers/python/example.py"

  controller-quad:
    # Flies the F450 quadrotor (ASTRUM's second vehicle class) via the built-in
    # multirotor hover-hold autopilot: hands the sim one high-level target
    # (climb + heading) and monitors. Reuses the Python controller unchanged —
    # the wire protocol is vehicle-agnostic; only the sim's autopilot law differs.
    # Opt-in: `docker compose --profile quad up sim controller-quad`
    # (or `make demo-quad`), which pairs with config/scenario.quad.toml.
    image: astrum-dev:latest
    working_dir: /workspace
    profiles: ["quad"]
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      ASTRUM_ZENOH_CONNECT: tcp/sim:7447
      ASTRUM_TARGET_ID: "1"
      ASTRUM_TARGET_HEADING_DEG: "180"  # yaw from the initial 90° to 180°
      ASTRUM_TARGET_ALT_M: "130"        # climb from 100 m to 130 m and hold
      ASTRUM_TARGET_SPD_MPS: "0"        # ignored for a hovering rotorcraft
      ASTRUM_CONTROL_MODE: autopilot    # the sim's multirotor hover-hold flies it
    depends_on:
      - sim
    networks:
      - astrum
    command:
      - bash
      - -lc
      - "exec python controllers/python/example.py"

  dogfight-train:
    # From-scratch RL training for the dogfight learner (controllers/rl). The env
    # is EMBEDDED — astrum_env runs a headless sim in-process — so this needs
    # neither the `sim` service nor Zenoh. Opt-in via the `rl` profile:
    #   docker compose --profile rl run --rm dogfight-train
    # (or `make rl-smoke` / `make rl-train`, which override the command).
    #
    # uv manages a SEPARATE, GPU-heavy env (torch + CUDA) under controllers/rl. It
    # lives on the `uv-envs` volume (UV_PROJECT_ENVIRONMENT) so the multi-GB install
    # stays off the bind-mounted source and persists across runs. The GPU is granted
    # via CDI below — requires nvidia-container-toolkit on the host (the cu128 torch
    # wheel bundles its own CUDA runtime; no CUDA base image needed).
    image: astrum-dev:latest
    working_dir: /workspace
    profiles: ["rl"]
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
      - uv-envs:/opt/uv
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/uv/dogfight
      UV_CACHE_DIR: /opt/uv/cache
      # curriculum-97's obs width, forwarded from the host so `ASTRUM_C97_VERTICAL=0 make ...`
      # reaches the trainer AND its worker subprocesses. Defaults to the 45-float treatment; 0 is
      # the 41-float null control (see `astrum_dogfight.constants.OBS_DIM`). It must be declared
      # here — `docker compose run` does NOT forward arbitrary host env vars, so without this line
      # the control would silently train the treatment ([[outcome-reward-invisible-switch]]).
      ASTRUM_C97_VERTICAL: ${ASTRUM_C97_VERTICAL:-1}
    # GPU via CDI (Container Device Interface). The host has nvidia-container-toolkit
    # with a generated CDI spec (/etc/cdi or /var/run/cdi/nvidia.yaml) but no `nvidia`
    # Docker *runtime* registered in daemon.json, so the older
    # `deploy.resources.reservations.devices: {driver: nvidia}` syntax can't resolve.
    # CDI needs neither a daemon runtime nor a restart. To grant a subset instead of
    # all GPUs, use e.g. "nvidia.com/gpu=0".
    devices:
      - "nvidia.com/gpu=all"
    command:
      - bash
      - -lc
      - "cd controllers/rl && uv run python -m astrum_rl.smoke_gpu"

  # --- Formation demo: 1 leader + 3 decentralized MPC followers ---------------
  # Opt-in via the `formation` profile (`make demo-formation`), paired with
  # config/scenario.formation.toml. The leader flies a figure-eight; each
  # follower independently watches the leader's telemetry and MPC-tracks its
  # slot. Altitude 4572 m (15000 ft). The --speed 100 command settles ~120 m/s
  # through the throttle loop; the speed-synced carrot and the 8 km x 4 km pattern
  # drive the leader to ~41 deg of bank — an aggressive, easy-to-see figure-eight.
  # This is about as tight as this formation holds: much tighter and the inner
  # wingman/trail need >60 deg of bank to keep their slots and diverge (the f16's
  # 60-deg cap is the limit). Shrink the slots too to carve a tighter pattern.
  controller-lead:
    <<: *formation-controller
    command:
      - bash
      - -lc
      - "exec python controllers/optimal/python/run.py --law figure8 --id 1
         --alt 4572 --speed 100 --fig-rx 8000 --fig-ry 4000"

  controller-wing-left:
    <<: *formation-controller
    command:
      - bash
      - -lc
      - "exec python controllers/optimal/python/run.py --law formation --id 2
         --leader 1 --slot left --alt 4572"

  controller-wing-right:
    <<: *formation-controller
    command:
      - bash
      - -lc
      - "exec python controllers/optimal/python/run.py --law formation --id 3
         --leader 1 --slot right --alt 4572"

  controller-trail:
    <<: *formation-controller
    command:
      - bash
      - -lc
      - "exec python controllers/optimal/python/run.py --law formation --id 4
         --leader 1 --slot trail --alt 4572"

networks:
  astrum:
    driver: bridge

volumes:
  cargo-registry:
  cargo-target:
  # uv's RL training env + download cache (torch/CUDA) — kept off the bind mount.
  uv-envs:
