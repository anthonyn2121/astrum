name: astrum

# The ASTRUM dev environment: one long-lived `dev` container from the
# `astrum-dev` image (docker/Dockerfile), with the checkout bind-mounted at
# /workspace. `make dev` builds the image if it is missing or out of date,
# starts the container and opens a shell in it; every further `make dev` opens
# another shell in the same container, so processes started in one shell reach
# the others over loopback. Inside, `astrum run …` starts the sim, its
# controllers and the viewer as processes; host-side `make` targets run one-off
# commands in fresh containers of this service (`docker compose run --rm dev`).
#
# Published ports bind to 127.0.0.1 only: Zenoh has no authentication here, so
# anyone who can reach 7447 can command aircraft.

services:
  dev:
    image: astrum-dev:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Run as the host user so files written into the bind mount keep the
        # host's ownership (`make` exports these from `id -u` / `id -g`).
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /workspace
    # tini as PID 1: forwards SIGTERM so `make down` stops the container promptly.
    init: true
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    environment:
      # The viewer (`astrum run --watch`, `astrum web`) listens on all
      # interfaces *inside* the container so the port mapping reaches it (the
      # binary defaults to loopback); the host side publishes on 127.0.0.1.
      ASTRUM_WEB_BIND: 0.0.0.0:8080
      ASTRUM_WEB_ROOT: /workspace/web
      # Map-tile proxy settings and the browser frame-rate cap, passed through
      # from the host when set (unset → astrum-web's defaults).
      ASTRUM_TILE_URL:
      ASTRUM_TILE_CACHE:
      ASTRUM_WEB_MAX_HZ:
    ports:
      - "127.0.0.1:7447:7447"   # Zenoh (telemetry + commands) of `astrum run`'s sim
      - "127.0.0.1:8080:8080"   # viewer: HTTP + WebSocket
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-target:
